name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracex
          POSTGRES_PASSWORD: tracex
          POSTGRES_DB: tracex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracex -d tracex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: local-ci-signing-key-for-tests-only
      TEST_DATABASE_URL: postgresql+psycopg://tracex:tracex@127.0.0.1:5432/tracex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Run tests against SQLite
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: 'sqlite:///:memory:'

  windows-backend:
    runs-on: windows-latest
    env:
      SECRET_KEY: local-ci-signing-key-for-tests-only
      TEST_DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
